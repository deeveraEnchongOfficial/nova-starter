server {
    listen 80;
    listen 443 ssl;
    server_name storage.nova-starter.localhost;

    ssl_certificate /etc/nginx/certs/_wildcard.nova-starter.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/_wildcard.nova-starter.localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 0;
    ignore_invalid_headers off;

    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7200;
        proxy_send_timeout 7200;
        proxy_read_timeout 7200;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name storage-console.nova-starter.localhost;

    ssl_certificate /etc/nginx/certs/_wildcard.nova-starter.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/_wildcard.nova-starter.localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 0;
    ignore_invalid_headers off;

    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        chunked_transfer_encoding off;
    }
}
